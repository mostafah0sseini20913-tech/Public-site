<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#0d1117;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}
.container{
    text-align:center;
    animation:fade 1.5s ease;
}
h1{
    font-size:60px;
    color:#58a6ff;
    text-shadow:0 0 20px #58a6ff;
}
p{
    margin-top:20px;
    font-size:20px;
    color:#c9d1d9;
}
button{
    margin-top:35px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:#238636;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}
button:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px #238636;
}
@keyframes fade{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="container">
    <h1>WELCOME</h1>
    <p>A modern website is under construction.</p>
    <button>Explore</button>
</div>

</body>
</html>
